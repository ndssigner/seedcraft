# Tests the reference implementation (both modes) and the web tool against the
# test vectors, builds the web tool (reproducible: compare the printed SHA-256
# with a local build of the same commit) and keeps it as an artifact. Rebuilds
# the printable PDFs and fails if they differ from the committed ones. Bundles
# everything in a reproducible zip. On main, publishes the web tool and the
# PDFs on GitHub Pages; on a version tag (v*), drafts a release.
name: test-and-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python reference against the vectors
        run: python3 tests/test_sequences.py
      - name: Pad mode against its vectors, and the risk audit's evidence
        run: python3 tests/test_pad.py
      - name: Pad mode vectors are up to date
        run: |
          python3 tools/gen_pad_vectors.py > vectors/sequences-pad.json
          git diff --exit-code -- vectors/
      - name: Tools of the risk audit run (pad reuse, pieces tables in short)
        run: |
          python3 tools/pad_reuse.py
          python3 tools/pieces_tables.py 2000
      - name: JavaScript against the vectors
        run: node web/test.mjs
      - name: Build the web tool
        run: node web/build.mjs | tee SHA256.txt
      - name: Install Typst 0.15.1 (pinned by hash)
        run: |
          curl -fsSL -o typst.tar.xz https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  typst.tar.xz" | sha256sum -c
          tar xf typst.tar.xz && sudo install typst-x86_64-unknown-linux-musl/typst /usr/local/bin/
      - name: By-hand PDFs are reproducible and up to date
        run: |
          docs/manual/build.sh
          git diff --exit-code -- docs/
      - name: Bundle (tag name, or dev-<commit> between releases)
        run: |
          case "$GITHUB_REF" in refs/tags/v*) v="$GITHUB_REF_NAME" ;; *) v="dev-$(echo "$GITHUB_SHA" | cut -c1-12)" ;; esac
          python3 tools/bundle.py "$v"
      - uses: actions/upload-artifact@v4
        with:
          name: seedcraft
          path: |
            dist/seedcraft-*.zip
            dist/SHA256SUMS
      - name: The site for GitHub Pages
        run: mkdir site && cp dist/seedcraft-sequences.html site/index.html && cp docs/*.pdf site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    if: github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: seedcraft
      - name: Draft release (published by hand after checking the hash)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" seedcraft-*.zip SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --draft --prerelease \
            --title "Seedcraft $GITHUB_REF_NAME" \
            --notes "Web tool, by-hand guide and SeedQR templates (EN/ES), specification. Drafts: test seeds only. Verify: sha256sum -c SHA256SUMS"
